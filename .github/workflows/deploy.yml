name: Deploy Eporner Function

on:
  push:
    branches:
      - main # This will trigger the action when you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest # We are using the latest Ubuntu runner for this job

    steps:
      - name: Checkout code
        uses: actions/checkout@v2 # This checks out your code from the repository

      - name: Set up Node.js
        uses: actions/setup-node@v2 # Sets up Node.js on the runner
        with:
          node-version: '14' # Use Node.js version 14

      - name: Create the function to fetch Eporner videos
        run: |
          mkdir -p ./functions # Create a folder to store your function
          echo 'const fetch = require("node-fetch");' > ./functions/fetchEporner.js
          echo 'exports.handler = async (event) => {' >> ./functions/fetchEporner.js
          echo '  const query = event.queryStringParameters.q || "trending";' >> ./functions/fetchEporner.js
          echo '  const apiUrl = `https://www.eporner.com/api/v2/video/search/?query=${encodeURIComponent(query)}&per_page=12&order=top-weekly&thumbsize=big`;' >> ./functions/fetchEporner.js
          echo '  const res = await fetch(apiUrl);' >> ./functions/fetchEporner.js
          echo '  const data = await res.json();' >> ./functions/fetchEporner.js
          echo '  return { statusCode: 200, body: JSON.stringify(data) };' >> ./functions/fetchEporner.js
          echo '};' >> ./functions/fetchEporner.js

          # Commit and push the function to the repository
          git config --global user.name "Your GitHub Username"
          git config --global user.email "Your GitHub Email"
          git add .
          git commit -m "Deploy serverless function"
          git push origin main

